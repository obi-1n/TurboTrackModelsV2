name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
         docker build \
           -t obi1n/turbotrackmodels:latest \
           -f "TurboTrackModels-Dotnet Core/Dockerfile" \
           .

      - name: Push Docker Image
        run: |
          docker push obi1n/turbotrackmodels:latest
     - name: Check key format
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | head -1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull obi1n/turbotrackmodels:latest

            sudo docker stop turbotrackmodels || true
            sudo docker rm turbotrackmodels || true

            sudo docker run -d \
              --name turbotrackmodels \
              -p 80:8080 \
              obi1n/turbotrackmodels:latest
